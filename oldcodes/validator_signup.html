<!DOCTYPE html>
<html lang= "en" dir="ltr">
<head>>

    <meta charset="UTF-8">
    <title>Validator Sign up</title>
    <link rel="stylesheet" href="validator_login.css">

    <!-- Fontawesome CDN Link-->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
</head>

<!-- Header Section -->
<header class="header">
    <div class="logo">
        <img src="images/logo1.png" alt="City Housing Logo">
    </div>
</header>


<body>
    <div class="container">
        <input type="checkbox" id="flip">
        <div class="cover">
            <div class="front">
                <img src="images/cityhall.jpg" alt="">
            </div>
        </div>
       
        <form action="validator_signup.php" method="POST">
            <div class="form-content">
                <div class="signup-form">

                    <div class="title">Validator Sign Up</div>

                    <div class="input-boxes">  
                        <div class="input-box">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" name="username" placeholder="Username" required>
                        </div>
                        
                        <div class="input-box">
                            <i class="fas fa-user"></i>
                            <input type="text" id="name" name="name" placeholder="Full Name" required>
                        </div>
                        
                        <div class="input-box">
                            <i class="fas fa-envelope"></i>
                            <input type="text" id="email" name="email" placeholder="Email" required>
                        </div>

                        <div class="input-box">   
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Password" required> 
                        </div>    
                    </div>

                    <div class="button input-box">
                        <input type="submit" value="Sign Up">
                    </div>                      
                    <div class="text sign-up-text">Already have an account? <button onclick="window.location.href='validator_login.html'" style="border: none; background: none; color: blue; text-decoration: underline; cursor: pointer;">Sign In</button> </div>         
                    
                </div>
            </div> 
        </form>                 
    </div>

</body>
</html>
